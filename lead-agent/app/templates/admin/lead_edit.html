{% extends "admin/base.html" %}
{% block title %}Edit {{ lead.name }} — {{ business_name }}{% endblock %}
{% block page_title %}Edit lead{% endblock %}
{% block content %}
<div class="edit-lead-page">
  <div class="edit-lead-header">
    <h2 class="edit-lead-name">{{ lead.name }}</h2>
    <p class="muted edit-lead-meta">{{ lead.phone }} · {{ lead.source or '—' }}</p>
  </div>

  <div class="card edit-lead-card">
    <form method="post" action="/admin/leads/{{ lead.id }}/edit" class="edit-lead-form">
      <label>Status
        <select name="status">
          {% for s in statuses %}
          <option value="{{ s }}" {% if lead.status == s %}selected{% endif %}>{{ s }}</option>
          {% endfor %}
        </select>
      </label>
      <label>Tags <span class="muted">(comma-separated)</span>
        <input type="text" name="tags" value="{{ lead.tags or '' }}" placeholder="urgent, follow-up" />
      </label>
      <label>Notes
        <textarea name="notes" rows="6" placeholder="Call history, next steps…">{{ lead.notes or '' }}</textarea>
      </label>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">Save changes</button>
        <a class="btn" href="/admin/leads">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
